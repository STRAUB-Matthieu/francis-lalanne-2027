<title>Échanger avec Francis Lalanne</title>
<script>
  // Redirige vers le formulaire « Échanger avec Francis Lalanne » en conservant le pré-remplissage.
  // Seuls les paramètres du formulaire (usp, entry.*) sont transmis ; la destination est fixe.
  (function () {
    var cible = "https://docs.google.com/forms/d/e/1FAIpQLSfEjeyuQa4Gmk9lGHU5BA0fVbHwD4_EEaMxFxUmcyPi6ADIYA/viewform";
    var entree = new URLSearchParams(window.location.search), sortie = new URLSearchParams();
    entree.forEach(function (v, k) { if (k === "usp" || /^entry\.\d+$/.test(k)) sortie.append(k, v); });
    var q = sortie.toString();
    window.location.replace(cible + (q ? "?" + q : ""));
  })();
</script>

</body>
